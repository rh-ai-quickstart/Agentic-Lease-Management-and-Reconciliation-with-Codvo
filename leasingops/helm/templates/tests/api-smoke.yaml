{{- /*
helm test smoke pod.

Runs after `helm install` / `helm upgrade` when the user invokes
`helm test neio-leasingops -n leasingops`. Exercises the most important
paths:

  - GET /health on the API
  - POST /api/v1/auth/login with the demo credentials (form-encoded
    OAuth2 password grant)
  - POST /api/v1/leasingops/workspaces/<demo-workspace>/documents/upload
    with the bundled sample lease, asserts HTTP 200 and a document_id
    in the response
  - GET /api/v1/leasingops/documents/<id>/status until current_agent
    moves past `upload`, or 90 seconds elapses

Exit 0 only if all checks pass. The pod stays in the namespace for the
operator to inspect (no hook-delete-policy on test pods so logs are
readable after the run). Re-running `helm test` overwrites it.

Opt out with `--set tests.enabled=false`.
*/}}
{{- $testsEnabled := true }}
{{- if and .Values.tests (hasKey .Values.tests "enabled") }}
{{- $testsEnabled = .Values.tests.enabled }}
{{- end }}
{{- if $testsEnabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "neio-leasingops.fullname" . }}-test-api-smoke
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "neio-leasingops.labels" . | nindent 4 }}
    app.kubernetes.io/component: test-api-smoke
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "10"
spec:
  restartPolicy: Never
  serviceAccountName: {{ include "neio-leasingops.serviceAccountName" . }}
  containers:
    - name: api-smoke
      image: registry.access.redhat.com/ubi9/python-311:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: API_BASE
          value: "http://{{ include "neio-leasingops.fullname" . }}-api:{{ .Values.api.service.port | default 8001 }}"
        - name: DEMO_USERNAME
          value: {{ (.Values.tests).demoUsername | default "demo@neio.ai" | quote }}
        # Read the demo password from the cluster secret so `helm test` works
        # without anyone passing the literal in. The chart wires the same
        # secret key into the API deployment; both must match for login to
        # succeed.
        - name: DEMO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "neio-leasingops.fullname" . }}-secrets
              key: DEMO_PASSWORD
        - name: DEMO_WORKSPACE
          value: {{ (.Values.tests).demoWorkspace | default "11111111-1111-1111-1111-111111111111" | quote }}
      command: ["python3", "-c"]
      args:
        - |
          import json, os, sys, time, urllib.parse, urllib.request, urllib.error

          api = os.environ["API_BASE"].rstrip("/")
          username = os.environ["DEMO_USERNAME"]
          password = os.environ["DEMO_PASSWORD"]
          workspace = os.environ["DEMO_WORKSPACE"]

          def fail(msg):
              print(f"FAIL: {msg}", file=sys.stderr)
              sys.exit(1)

          def get(path, headers=None):
              req = urllib.request.Request(api + path, headers=headers or {})
              return urllib.request.urlopen(req, timeout=15)

          def post_form(path, data, headers=None):
              body = urllib.parse.urlencode(data).encode()
              h = {"Content-Type": "application/x-www-form-urlencoded"}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(api + path, data=body, method="POST", headers=h)
              return urllib.request.urlopen(req, timeout=15)

          def post_multipart(path, fields, files, headers=None):
              # Minimal multipart/form-data without external deps.
              import io, secrets
              boundary = "----neio-test-" + secrets.token_hex(8)
              buf = io.BytesIO()
              for k, v in fields.items():
                  buf.write(f"--{boundary}\r\n".encode())
                  buf.write(f'Content-Disposition: form-data; name="{k}"\r\n\r\n'.encode())
                  buf.write(str(v).encode())
                  buf.write(b"\r\n")
              for k, (fname, content, ctype) in files.items():
                  buf.write(f"--{boundary}\r\n".encode())
                  buf.write(f'Content-Disposition: form-data; name="{k}"; filename="{fname}"\r\n'.encode())
                  buf.write(f"Content-Type: {ctype}\r\n\r\n".encode())
                  buf.write(content)
                  buf.write(b"\r\n")
              buf.write(f"--{boundary}--\r\n".encode())
              h = {"Content-Type": f"multipart/form-data; boundary={boundary}"}
              if headers:
                  h.update(headers)
              req = urllib.request.Request(api + path, data=buf.getvalue(), method="POST", headers=h)
              return urllib.request.urlopen(req, timeout=30)

          # 1. Health
          print(f"[1/4] GET {api}/health")
          r = get("/health")
          health = json.loads(r.read())
          if health.get("status") != "healthy":
              fail(f"unexpected health response: {health}")
          print(f"      -> {health}")

          # 2. Login
          print(f"[2/4] POST /api/v1/auth/login (form-encoded)")
          r = post_form("/api/v1/auth/login", {"username": username, "password": password})
          tok = json.loads(r.read())["access_token"]
          auth_h = {"Authorization": f"Bearer {tok}"}
          print(f"      -> got bearer token ({len(tok)} chars)")

          # 3. Upload a full sample lease agreement. This doubles as the
          #    quickstart's seed data, so it carries every term the 11-stage
          #    pipeline extracts. Key terms are front-loaded because term
          #    extraction truncates the document to its first 6000 characters.
          #    Fictional sample data. Plain text (not PDF) so the chart stays
          #    self-contained and air-gap safe with no binary payload.
          payload_text = (
              "AIRCRAFT OPERATING LEASE AGREEMENT\n"
              "Reference: LA-N67890-7203\n"
              "Dated: 15 January 2024\n\n"
              "PARTIES\n"
              "Lessor: Global Wing Finance BV, Schiphol Boulevard 127, 1118 BG Amsterdam, Netherlands\n"
              "Lessee: Coastal Charter Services Ltd., 4400 Aviation Way, Miami, FL 33122, United States of America\n"
              "Operator: Coastal Charter Services Ltd.\n\n"
              "1. AIRCRAFT\n"
              "Manufacturer: Airbus\n"
              "Type/Model: A319-100\n"
              "Manufacturer Serial Number (MSN): 7203\n"
              "Registration Mark: N67890\n"
              "Year of Manufacture: 2015\n"
              "Engines: two (2) CFM International CFM56-5B5/P\n"
              "  Engine position 1, ESN 697412\n"
              "  Engine position 2, ESN 697418\n"
              "APU: Honeywell 131-9A, Serial Number APU-55231\n\n"
              "2. TERM\n"
              "Lease Type: Operating Lease\n"
              "Commencement Date: 2024-02-01\n"
              "Expiration Date: 2029-01-31\n"
              "Scheduled Redelivery Date: 2029-01-31\n"
              "Lease Term: sixty (60) months\n\n"
              "3. RENT AND FINANCIAL TERMS\n"
              "Monthly Base Rent: USD 295,000 payable in advance on the first day of each month\n"
              "Rent Currency: USD\n"
              "Security Deposit: USD 590,000\n"
              "Letter of Credit Amount: USD 295,000\n\n"
              "4. MAINTENANCE RESERVES\n"
              "Airframe Heavy Maintenance Reserve: USD 165.00 per Flight Hour\n"
              "Engine Performance Restoration Reserve: USD 210.00 per Flight Hour per engine\n"
              "Engine LLP Reserve: USD 145.00 per Flight Cycle per engine\n"
              "Landing Gear Overhaul Reserve: USD 22.00 per Flight Hour\n"
              "APU Reserve: USD 18.00 per APU Hour\n"
              "Reserves are payable monthly in arrears against certified utilization reports.\n\n"
              "5. UTILIZATION LIMITS\n"
              "Maximum Flight Hours per Year: 3,000\n"
              "Maximum Flight Cycles per Year: 1,800\n"
              "Minimum average Flight Hour to Flight Cycle ratio: 1.5 to 1\n"
              "Utilization reports are due within ten (10) days of each month end.\n\n"
              "6. RETURN CONDITIONS (SCHEDULE 5 - PHYSICAL REDELIVERY STANDARDS)\n"
              "6.1 The Aircraft shall be redelivered at Dublin (EIDW) in airworthy condition.\n"
              "6.2 Airframe: fresh from a C-Check performed within 30 days of redelivery.\n"
              "6.3 Engines: not less than 3,000 Flight Hours remaining to first limiter; EGT margin not less than 15 degrees C.\n"
              "6.4 Landing Gear: not less than 24 months remaining to next overhaul.\n"
              "6.5 APU: not less than 1,500 hours remaining to next shop visit.\n"
              "6.6 Interior: cabin fully serviceable; no more than 5 percent of seat covers showing wear.\n"
              "6.7 Paint: exterior in good condition with Lessee livery removed.\n"
              "6.8 Technical Records: complete, in the English language, in hard copy and digital form.\n"
              "6.9 Airworthiness Directives: all ADs with compliance dates on or before redelivery fully complied with.\n\n"
              "7. INSURANCE\n"
              "Hull All Risks agreed value: USD 32,000,000\n"
              "Third Party Liability: USD 750,000,000 combined single limit\n\n"
              "8. GOVERNING LAW\n"
              "This Agreement is governed by English law.\n\n"
              "NOTE: Fictional sample data shipped with the NeIO LeasingOps quickstart\n"
              "for demonstration and smoke testing. Not a real lease agreement.\n"
          )
          print(f"[3/4] POST /api/v1/leasingops/workspaces/{workspace}/documents/upload")
          try:
              r = post_multipart(
                  f"/api/v1/leasingops/workspaces/{workspace}/documents/upload",
                  fields={},
                  files={"file": ("LA-N67890-7203.txt", payload_text.encode(), "text/plain")},
                  headers=auth_h,
              )
              up = json.loads(r.read())
          except urllib.error.HTTPError as e:
              fail(f"upload failed: HTTP {e.code} {e.read().decode()[:300]}")
          doc_id = up.get("document_id") or up.get("id")
          if not doc_id:
              fail(f"upload response missing document_id: {up}")
          print(f"      -> document_id={doc_id} status={up.get('status')}")

          # 4. Poll status briefly; just confirm the worker moved past upload.
          print(f"[4/4] GET /api/v1/leasingops/documents/{doc_id}/status (poll)")
          deadline = time.time() + 90
          last = None
          while time.time() < deadline:
              try:
                  r = get(f"/api/v1/leasingops/documents/{doc_id}/status", headers=auth_h)
                  last = json.loads(r.read())
              except urllib.error.HTTPError as e:
                  print(f"  status poll HTTP {e.code}")
                  time.sleep(3)
                  continue
              cur = last.get("current_agent")
              st = last.get("status")
              print(f"  status={st} current_agent={cur}")
              if cur and cur != "upload":
                  print("PASS: pipeline moved past upload stage")
                  sys.exit(0)
              if st == "failed":
                  fail(f"document failed: {last.get('error')}")
              time.sleep(5)
          fail(f"pipeline did not advance past upload within 90s; last status: {last}")
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
{{- end }}
